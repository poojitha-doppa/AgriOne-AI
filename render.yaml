services:
  - type: web
    name: agri-mytra-backend
    runtime: node
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: auto
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_VISION_MODEL
        value: google/gemini-2.0-flash-001
      - key: OPENROUTER_SITE_URL
        value: ""
      - key: OPENROUTER_APP_NAME
        value: Agri_Mytra
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: ROBOFLOW_URL
        sync: false
      - key: ROBOFLOW_CONFIDENCE_CONFIRMED
        value: "65"
      - key: ROBOFLOW_CONFIDENCE_LOW
        value: "35"
